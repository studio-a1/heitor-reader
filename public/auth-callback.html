<!DOCTYPE html>
<html>
<head>
  <title>Autenticando...</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 60px; background: #171717; color: #e5e5e5; }
    p { font-size: 1.1rem; }
    .spinner { margin: 20px auto; width: 40px; height: 40px; border: 4px solid #444; border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Autenticando... aguarde.</p>
  <script>
    const { createClient } = supabase;
    const client = createClient(
      'https://bbxkttcjgaqiunquycyd.supabase.co',
      'sb_publishable_X8q5fYPIp6D8NILD3yMXlQ_oTtyO3am'
    );

    client.auth.getSession().then(({ data }) => {
      if (data?.session) {
        document.querySelector('p').textContent = '✅ Login realizado! Voltando ao app...';
        setTimeout(() => window.close(), 1500);
      } else {
        // Tenta processar o hash da URL (token vem no #)
        client.auth.onAuthStateChange((event, session) => {
          if (session) {
            document.querySelector('p').textContent = '✅ Login realizado! Voltando ao app...';
            setTimeout(() => window.close(), 1500);
          }
        });
      }
    });
  </script>
</body>
</html>
